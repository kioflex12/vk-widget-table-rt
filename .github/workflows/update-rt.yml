name: Update RT table

# Автообновление итоговой таблицы RT: расчёт из mafrate.pro + gomafia.pro и запись
# в лист "RT DATA" published-Google-Sheet, откуда её читает VK-виджет.

on:
  workflow_dispatch: {}          # ручной запуск из вкладки Actions
  schedule:
    - cron: "0 6 * * *"          # ежедневно в 06:00 UTC

# запрещаем параллельные прогоны, чтобы две записи не пересеклись
concurrency:
  group: update-rt
  cancel-in-progress: false

permissions:
  contents: write          # нужно, чтобы коммитить обновлённый avatars.json

jobs:
  update-rt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (compute + write RT DATA)
        env:
          MAFRATE_LOGIN: ${{ secrets.MAFRATE_LOGIN }}
          MAFRATE_PASSWORD: ${{ secrets.MAFRATE_PASSWORD }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          # Опциональный: сервисный токен VK для аватарок (users.get). Нет секрета -> avatars.json не трогаем.
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: python pipeline/rt_pipeline_fast.py

      - name: Commit avatars.json (если изменился)
        run: |
          if [ -n "$(git status --porcelain avatars.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add avatars.json
            git commit -m "chore: обновить avatars.json (автообновление аватарок)"
            git push
          else
            echo "avatars.json не изменился — коммит не нужен"
          fi
